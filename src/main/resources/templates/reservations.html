<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Reservations</title>
    <link rel="stylesheet" type="text/css" href="css/StiloviForma.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>
<body>
    <div th:insert="~{fragments/navbar.html :: navbar}"></div>
    <div class="container">
        <h2>Your Reservations</h2>
        <div class="filters">
            <a href="#" th:href="@{/reservations}">All</a> | 
            <a href="#" th:href="@{/reservations(filter='future')}">Future</a> | 
            <a href="#" th:href="@{/reservations(filter='past')}">Past</a>
        </div>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Travel</th>
                    <th>Start Date</th>
                    <th>End Date</th>
                    <th>Reserved Seats</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="reservation : ${reservations}">
                    <td th:text="${reservation.travel.destinationName}">Travel Title</td>
                    <td th:text="${#temporals.format(reservation.travel.departureDateTime, 'yyyy-MM-dd HH:mm')}">Start Date</td>
                    <td th:text="${#temporals.format(reservation.travel.returnDateTime, 'yyyy-MM-dd HH:mm')}">End Date</td>
                    <td th:text="${reservation.reservedSeats}">Reserved Seats</td>
                    <td>
                        <button th:if="${reservation.travel.departureDateTime.isAfter(T(java.time.LocalDateTime).now())}" 
                                class="btn btn-danger"
                                th:attr="data-id=${reservation.id}" 
                                onclick="cancelReservation(this)">
                            Cancel
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function cancelReservation(button) {
            var reservationId = button.getAttribute("data-id");
            if (confirm("Are you sure you want to cancel this reservation?")) {
                $.post("/reservations/cancel", { reservationId: reservationId })
                    .done(function() {
                        location.reload();
                    })
                    .fail(function() {
                        alert("Failed to cancel the reservation.");
                    });
            }
        }
    </script>
</body>
</html>
