<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <base th:href="@{/}">
    <link rel="stylesheet" type="text/css" href="static/css/StiloviForma.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL"
        crossorigin="anonymous"></script>
    <title>Add users</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            /*padding: 20px;*/
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: #fff;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .form-table {
            width: 100%;
        }

        .form-table th {
            text-align: right;
            padding: 10px;
            width: 30%;
        }

        .form-table td {
            padding: 10px;
        }

        .form-table input[type="text"],
        .form-table input[type="password"],
        .form-table input[type="email"],
        .form-table input[type="date"],
        .form-table input[type="tel"] {
            width: calc(100% - 20px);
            padding: 5px;
            border-radius: 3px;
            border: 1px solid #ccc;
            transition: border-color 0.3s ease-in-out;
        }

        .form-table input[type="text"]:focus,
        .form-table input[type="password"]:focus,
        .form-table input[type="email"]:focus,
        .form-table input[type="date"]:focus,
        .form-table input[type="tel"]:focus {
            border-color: #007bff;
            outline: none;
        }

        .form-table input[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.3s ease-in-out;
        }

        .form-table input[type="submit"]:hover {
            background-color: #0056b3;
        }

        .message {
            margin-top: 10px;
            color: #ff0000;
        }
    </style>
    <script>
    $(document).ready(function () {
        function validateForm() {
            var firstName = document.forms["addUserForm"]["firstName"].value.trim();
            var lastName = document.forms["addUserForm"]["lastName"].value.trim();
            var password = document.forms["addUserForm"]["password"].value.trim();
            var repeatPassword = document.forms["addUserForm"]["repeatPassword"].value.trim();
            var email = document.forms["addUserForm"]["emailAddress"].value.trim();
            var dateOfBirth = document.forms["addUserForm"]["dateOfBirth"].value.trim();
            var address = document.forms["addUserForm"]["address"].value.trim();
            var phoneNumber = document.forms["addUserForm"]["phoneNumber"].value.trim();
            var jmbg = document.forms["addUserForm"]["jmbg"].value.trim();

            var errors = [];

            var namePattern = /^[a-zA-Z]+$/;
            var emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            var datePattern = /^\d{4}-\d{2}-\d{2}$/;
            var phoneNumberPattern = /^\d{10}$/;
            var jmbgPattern = /^\d{13}$/;

            if (firstName === "") {
                errors.push("First name cannot be empty.");
            } else if (!firstName.match(namePattern)) {
                errors.push("Please enter a valid first name.");
            } else if (firstName.length > 50) {
                errors.push("First name cannot exceed 50 characters.");
            }

            if (lastName === "") {
                errors.push("Last name cannot be empty.");
            } else if (!lastName.match(namePattern)) {
                errors.push("Please enter a valid last name.");
            } else if (lastName.length > 50) {
                errors.push("Last name cannot exceed 50 characters.");
            }

            if (password === "") {
                errors.push("Password cannot be empty.");
            } else if (password.length > 50) {
                errors.push("Password cannot exceed 50 characters.");
            }

            if (repeatPassword === "") {
                errors.push("Repeat password cannot be empty.");
            } else if (password !== repeatPassword) {
                errors.push("Password and repeat password do not match.");
            }

            if (email === "") {
                errors.push("Email address cannot be empty.");
            } else if (!email.match(emailPattern)) {
                errors.push("Please enter a valid email address.");
            } else if (email.length > 50) {
                errors.push("Email address cannot exceed 50 characters.");
            }

            if (dateOfBirth === "") {
                errors.push("Date of birth cannot be empty.");
            } else if (!dateOfBirth.match(datePattern)) {
                errors.push("Please enter a valid date of birth.");
            }

            if (address === "") {
                errors.push("Address cannot be empty.");
            } else if (address.length > 50) {
                errors.push("Address cannot exceed 50 characters.");
            }

            if (phoneNumber === "") {
                errors.push("Phone number cannot be empty.");
            } else if (!phoneNumber.match(phoneNumberPattern)) {
                errors.push("Please enter a valid phone number (10 digits).");
            }

            if (jmbg === "") {
                errors.push("JMBG cannot be empty.");
            } else if (!jmbg.match(jmbgPattern)) {
                errors.push("Please enter a valid JMBG (13 digits).");
            }

            if (errors.length > 0) {
                var errorList = document.getElementById("errorList");
                errorList.innerHTML = "";
                errors.forEach(function (error) {
                    var li = document.createElement("li");
                    li.textContent = error;
                    errorList.appendChild(li);
                });
                $('#errorModal').modal('show');
                return false;
            }

            return true;
        }

        $("#addUserForm").submit(function () {
            return validateForm();
        });
    });

    $(document).ready(function() {
        $(".closeModalBtn").click(function() {
            $("#errorModal").modal("hide");
        });
    });

    </script>
</head>

<body>
    <div th:insert="~{fragments/navbar.html :: navbar}"></div>
    <div class="container mt-4">
        <form method="post" action="users/add" id="addUserForm">
            <table class="form-table">
                <caption>User</caption>
                <tr>
                    <th>First Name:</th>
                    <td><input type="text" value="" name="firstName" required></td>
                </tr>
                <tr>
                    <th>Last Name:</th>
                    <td><input type="text" value="" name="lastName" required></td>
                </tr>
                <tr>
                    <th>Password:</th>
                    <td><input type="password" value="" name="password" required></td>
                </tr>
                <tr>
                    <th>Repeat Password:</th>
                    <td><input type="password" value="" name="repeatPassword" required></td>
                </tr>
                <tr>
                    <th>Email Address:</th>
                    <td><input type="email" value="" name="emailAddress" required></td>
                </tr>
                <tr>
                    <th>Date of Birth:</th>
                    <td><input type="date" value="" name="dateOfBirth" required></td>
                </tr>
                <tr>
                    <th>Address:</th>
                    <td><input type="text" value="" name="address" required></td>
                </tr>
                <tr>
                    <th>Phone Number:</th>
                    <td><input type="tel" value="" name="phoneNumber" required></td>
                </tr>
                <tr>
                    <th>JMBG:</th>
                    <td><input type="text" value="" name="jmbg" required></td>
                </tr>
                <tr>
                    <th></th>
                    <td><input type="submit" value="Add" onclick="return validateForm()"></td>
                </tr>
            </table>
        </form>
        <div class="message" th:text="${message}"></div>
    </div>

    <!-- Error Modal -->
    <div class="modal fade" id="errorModal" tabindex="-1" role="dialog" aria-labelledby="errorModalLabel"
        aria-hidden="true">
        <div class="modal-dialog" role="document">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="errorModalLabel">Validation Errors</h5>
                    <button type="button" class="close closeModalBtn" data-dismiss="modal" aria-label="Close">
                        <span aria-hidden="true">&times;</span>
                    </button>
                </div>
                <div class="modal-body">
                    <ul id="errorList"></ul>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary closeModalBtn" data-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
