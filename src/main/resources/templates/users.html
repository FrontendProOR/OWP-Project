<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <base th:href="@{/}">
    <title>Users</title>
    <link rel="stylesheet" type="text/css" href="css/StiloviTabela.css" />
    <link rel="stylesheet" type="text/css" href="css/StiloviHorizontalniMeni.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</head>

<body>
<div th:insert="~{fragments/navbar.html :: navbar}"></div>
    <!--<ul>
        <li><a href="users">Users</a></li>
    </ul>
    -->
    <table>
        <caption>Users</caption>
        <tr>
            <th>Name</th>
            <th>Surname</th>
            <th>Email</th>
            <th>Address</th>
            <th>Date of Birth</th>
            <th>Phone Number</th>
            <th>Registration Date</th>
            <th>Role</th>
            <th></th>
        </tr>
        <tr th:each="itUser, status: ${users}">
        	<td th:text="${itUser.password}" hidden></td>
            <td th:text="${itUser.firstName}"></td>
            <td th:text="${itUser.lastName}"></td>
            <td th:text="${itUser.emailAddress}"></td>
            <td th:text="${itUser.address}"></td>
            <td th:text="${itUser.dateOfBirth}"></td>
            <td th:text="${itUser.phoneNumber}"></td>
            <td th:text="${itUser.registrationDateTime}"></td>
            <td th:text="${itUser.role}"></td>
            <td>
                <form method="post" action="users/delete">
                    <input type="hidden" name="id" th:value="${itUser.id}">
                    <input type="submit" value="Delete">
                </form>
            </td>
        </tr>
    </table>
</body>

</html>
