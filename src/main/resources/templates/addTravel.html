<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <base th:href="@{/}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <title>Add Travel</title>
    <script>
        function validateForm(form) {
            const discountPercentage = parseFloat(form.discountPercentage.value.trim());
            const discountEndDate = form.discountEndDate.value.trim();
            const destinationName = form.destinationName.value.trim();
            const departureDateTime = new Date(form.departureDateTime.value);
            const returnDateTime = new Date(form.returnDateTime.value);
            const arrangementPrice = parseFloat(form.arrangmentPrice.value.trim());
            const originalPrice = parseFloat(form.originalPrice.value.trim());
            const totalSeats = parseInt(form.totalSeats.value.trim());
            const availableSeats = parseInt(form.availableSeats.value.trim());

            // Validate discount fields
            if ((discountPercentage === 0.0 && discountEndDate) || (discountPercentage > 0.0 && !discountEndDate)) {
                alert("Both Discount Percentage and Discount End Date must be filled or both must be empty.");
                return false;
            }

            if (discountEndDate && discountPercentage < 1) {
                alert("Discount Percentage must be greater than 1 if Discount End Date is provided.");
                return false;
            }

            // Validate required fields
            if (!form.transportationType.value.trim() || !form.accommodationType.value.trim() ||
                !destinationName || !form.departureDateTime.value.trim() ||
                !form.returnDateTime.value.trim() || !form.originalPrice.value.trim() ||
                !form.totalSeats.value.trim() || !form.availableSeats.value.trim()) {
                alert("All fields except Discount Percentage and Discount End Date are required.");
                return false;
            }

            // Validate destination name length
            if (destinationName.length <= 2) {
                alert("Destination Name must be longer than 2 characters.");
                return false;
            }

            // Validate date times
            if (departureDateTime >= returnDateTime) {
                alert("Departure Date and Time must be before Return Date and Time.");
                return false;
            }

            // Validate original price
            if (originalPrice > 10000) {
                alert("Original Price cannot exceed 10000.");
                return false;
            }

            // Validate seats
            if (totalSeats > 999) {
                alert("Total Seats cannot exceed 999.");
                return false;
            }

            if (availableSeats > 999) {
                alert("Available Seats cannot exceed 999.");
                return false;
            }

            if(availableSeats > totalSeats){
            	alert("Number of available Seats cannot exceed number of total seats.");
                return false;
            }
            
            return true;
        }
    </script>
</head>
<body>
    <div th:insert="~{fragments/navbar.html :: navbar}"></div>
    <div class="container">
        <h2>Add New Travel</h2>
        <form method="post" th:action="@{/travels/add}" enctype="multipart/form-data" onsubmit="return validateForm(this)">
            <div class="mb-3">
                <label for="transportationType" class="form-label">Transportation Type</label>
                <select class="form-select" id="transportationType" name="transportationType" required>
                    <option value="AIRPLANE">Airplane</option>
                    <option value="BUS">Bus</option>
                    <option value="PERSONAL">Personal</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="accommodationType" class="form-label">Accommodation Type</label>
                <select class="form-select" id="accommodationType" name="accommodationType" required>
                    <option value="HOTEL">Hotel</option>
                    <option value="APARTMENT">Apartment</option>
                </select>
            </div>
            <div class="mb-3">
                <label for="destinationName" class="form-label">Destination Name</label>
                <input type="text" class="form-control" id="destinationName" name="destinationName" required>
            </div>
            <div class="mb-3">
                <label for="locationImage" class="form-label">Location Image</label>
                <input type="file" class="form-control" id="locationImage" name="locationImage" accept=".jpg, .png" required>
            </div>
            <div class="mb-3">
                <label for="travelCategory" class="form-label">Travel Category</label>
                <select class="form-select" id="travelCategory" name="travelCategory" required>
                    <option th:each="category : ${categories}" th:value="${category}" th:text="${category}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label for="departureDateTime" class="form-label">Departure Date and Time</label>
                <input type="datetime-local" class="form-control" id="departureDateTime" name="departureDateTime" required>
            </div>
            <div class="mb-3">
                <label for="returnDateTime" class="form-label">Return Date and Time</label>
                <input type="datetime-local" class="form-control" id="returnDateTime" name="returnDateTime" required>
            </div>
            <div class="mb-3">
                <label for="originalPrice" class="form-label">Original Price</label>
                <input type="number" class="form-control" id="originalPrice" name="originalPrice" step="0.01" required>
            </div>
            <div class="mb-3">
                <label for="arrangmentPrice" class="form-label">Arrangement Price</label>
                <input type="number" class="form-control" id="arrangmentPrice" name="arrangmentPrice" step="0.01" readonly>
            </div>
            <div class="mb-3">
                <label for="totalSeats" class="form-label">Total Seats</label>
                <input type="number" class="form-control" id="totalSeats" name="totalSeats" required>
            </div>
            <div class="mb-3">
                <label for="availableSeats" class="form-label">Available Seats</label>
                <input type="number" class="form-control" id="availableSeats" name="availableSeats" required>
            </div>
            <div class="mb-3">
                <label for="discountPercentage" class="form-label">Discount Percentage</label>
                <input type="number" class="form-control" id="discountPercentage" name="discountPercentage" step="0.01">
            </div>
            <div class="mb-3">
                <label for="discountEndDate" class="form-label">Discount End Date</label>
                <input type="datetime-local" class="form-control" id="discountEndDate" name="discountEndDate">
            </div>
            <button type="submit" class="btn btn-primary">Add Travel</button>
        </form>
    </div>
</body>
</html>
