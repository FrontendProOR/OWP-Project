<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/StiloviForma.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <base th:href="@{/travels}">
    <title>Travel</title>
    <style>
        .table-container {
            width: 95%;
            overflow-x: auto;
            margin: 0 auto;
        }
        
        table.table {
            font-size: 0.7rem;
        }

        th, td {
            white-space: nowrap;
        }

        .table-scroll {
            max-height: 450px; 
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div th:insert="~{fragments/navbar.html :: navbar}"></div>

<h2>Travel Details</h2>

<div th:if="${param.error}" class="alert alert-danger" role="alert">
    <span th:text="${param.error}"></span>
</div>

<div class="table-container">
    <div class="table-scroll">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Transportation Type</th>
                <th>Accommodation Type</th>
                <th>Destination Name</th>
                <th>Location Image</th>
                <th>Travel Category</th>
                <th>Departure Date and Time</th>
                <th>Return Date and Time</th>
                <th>Number of Nights</th>
                <th>Arrangement Price</th>
                <th>Total Seats</th>
                <th>Available Seats</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="travel, iterStat : ${travels}">
                <form th:action="@{'/travels/edit?id='+${travel.id}}" method="post">
                    <td><input type="text" name="id" th:value="${travel.id}" readonly></td>
                    <td>
                        <select class="form-control" id="transportationType" name="transportationType">
                            <option value="AIRPLANE" th:selected="${travel.transportationType.name() == 'AIRPLANE'}">Airplane</option>
                            <option value="BUS" th:selected="${travel.transportationType.name() == 'BUS'}">Bus</option>
                            <option value="PERSONAL" th:selected="${travel.transportationType.name() == 'PERSONAL'}">Personal</option>
                        </select>
                    </td>
                    <td>
                        <select class="form-control" id="accommodationType" name="accommodationType">
                            <option value="APARTMENT" th:selected="${travel.accommodationType.name() == 'APARTMENT'}">Apartment</option>
                            <option value="HOTEL" th:selected="${travel.accommodationType.name() == 'HOTEL'}">Hotel</option>
                        </select>
                    </td>
                    <td><input type="text" name="destinationName" th:value="${travel.destinationName}"></td>
                    <td><input type="text" name="locationImage" th:value="${travel.locationImage}"></td>
                    <td>
                        <select class="form-control" id="travelCategory" name="travelCategory">
                            <option value="SKIING" th:selected="${travel.travelCategory.categoryName.name() == 'SKIING'}">Skiing</option>
                            <option value="NEW_YEAR" th:selected="${travel.travelCategory.categoryName.name() == 'NEW_YEAR'}">New Year</option>
                            <option value="LAST_MINUTE" th:selected="${travel.travelCategory.categoryName.name() == 'LAST_MINUTE'}">Last Minute</option>
                            <option value="SUMMER_VACATION" th:selected="${travel.travelCategory.categoryName.name() == 'SUMMER_VACATION'}">Summer</option>
                        </select>
                    </td>
                    <td><input type="text" name="departureDateTime" th:value="${travel.formattedDepartureDateTime}"></td>
                    <td><input type="text" name="returnDateTime" th:value="${travel.formattedReturnDateTime}"></td>
                    <td><input type="text" name="numberOfNights" th:value="${travel.numberOfNights}" readonly></td>
                    <td><input type="text" name="arrangmentPrice" th:value="${travel.arrangmentPrice}"></td>
                    <td><input type="text" name="totalSeats" th:value="${travel.totalSeats}"></td>
                    <td><input type="text" name="availableSeats" th:value="${travel.availableSeats}"></td>
                    <td><button type="submit" class="btn btn-primary">Edit</button></td>
                </form>
                <form th:action="@{'/travels/delete?id='+${travel.id}}" method="post" th:if="${loggedUser != null && loggedUser.role.name() == 'MANAGER'}">
                    <td><input type="hidden" name="id" th:value="${travel.id}"><button type="submit" class="btn btn-danger">Delete</button></td>
                </form>
                
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="text-center">
    <a class="btn btn-primary" th:href="@{/travels/addTravel}" th:if="${loggedUser != null && loggedUser.role.name() == 'MANAGER'}">Add Travel</a>
</div>

</body>
</html>
