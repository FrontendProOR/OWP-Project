<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/StiloviForma.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <base th:href="@{/travels}">
    <title>Travel </title>
    <style>
        .table-container {
            width: 95%;
            overflow-x: auto;
            margin: 0 auto;
        }
        
        table.table {
            font-size: 0.7rem;
        }

        th, td {
            white-space: nowrap;
        }

        .table-scroll {
            max-height: 450px; 
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div th:insert="~{fragments/navbar.html :: navbar}"></div>

<h2>Travel Details</h2>
<div class="table-container">
    <div class="table-scroll">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Transportation Type</th>
                <th>Accommodation Type</th>
                <th>Destination Name</th>
                <th>Location Image</th>
                <th>Travel Category</th>
                <th>Departure Date and Time</th>
                <th>Return Date and Time</th>
                <th>Number of Nights</th>
                <th>Arrangement Price</th>
                <th>Total Seats</th>
                <th>Available Seats</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="travel, iterStat : ${travels}"><!-- th:if="${iterStat.index < 5}" -->
                <form th:action="@{'/travels/edit?id='+${travel.id}}" method="post">
                    <td><input type="text" name="id" th:value="${travel.id}" readonly></td>
                    <td><input type="text" name="transportationType" th:value="${travel.transportationType.toString()}"></td>
                    <td><input type="text" name="accommodationType" th:value="${travel.accommodationType.toString()}"></td>
                    <td><input type="text" name="destinationName" th:value="${travel.destinationName}"></td>
                    <td><input type="text" name="locationImage" th:value="${travel.locationImage}"></td>
                    <td><input type="text" name="travelCategory" th:value="${travel?.getTravelCategory()?.getCategoryName()?.toString()}" readonly></td>
                    <td><input type="datetime-local" name="departureDateTime" th:value="${travel.departureDateTime}"></td>
                    <td><input type="datetime-local" name="returnDateTime" th:value="${travel.returnDateTime}"></td>
                    <td><input type="text" name="numberOfNights" th:value="${travel.numberOfNights}" readonly></td>
                    <td><input type="number" name="arrangmentPrice" th:value="${travel.arrangmentPrice}"></td>
                    <td><input type="number" name="totalSeats" th:value="${travel.totalSeats}"></td>
                    <td><input type="number" name="availableSeats" th:value="${travel.availableSeats}" readonly></td>
                    <td><button type="submit" class="btn btn-primary">Edit</button></td>
                </form>
                <form th:action="@{'/travels/delete?id='+${travel.id}}" method="post">
                    <td><input type="hidden" name="id" th:value="${travel.id}"><button type="submit" class="btn btn-danger">Delete</button></td>
                </form>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<div class="text-center">
    <a class="btn btn-primary" th:href="@{/travels/addTravel}">Add Travel</a>
</div>

</body>
</html>
