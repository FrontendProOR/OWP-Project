<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/StiloviForma.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <base th:href="@{/travels}">
    <title>Travel</title>
    <style>
        .table-container {
            width: 95%;
            overflow-x: auto;
            margin: 0 auto;
        }
        
        table.table {
            font-size: 0.7rem;
        }

        th, td {
            white-space: nowrap;
        }

        .table-scroll {
            max-height: 450px; 
            overflow-y: auto;
        }
    </style>
    <script>
        function validateForm(form) {
            const discountPercentage = parseFloat(form.discountPercentage.value.trim());
            const discountEndDate = form.discountEndDate.value.trim();
            const destinationName = form.destinationName.value.trim();
            const departureDateTime = new Date(form.departureDateTime.value);
            const returnDateTime = new Date(form.returnDateTime.value);
            const arrangementPrice = parseFloat(form.arrangmentPrice.value.trim());
            const originalPrice = parseFloat(form.originalPrice.value.trim());
            const totalSeats = parseInt(form.totalSeats.value.trim());
            const availableSeats = parseInt(form.availableSeats.value.trim());

            // Validate discount fields
            if ((discountPercentage === 0.0 && discountEndDate) || (discountPercentage > 0.0 && !discountEndDate)) {
                alert("Both Discount Percentage and Discount End Date must be filled or both must be empty.");
                return false;
            }

            if (discountEndDate && discountPercentage < 1) {
                alert("Discount Percentage must be greater than 1 if Discount End Date is provided.");
                return false;
            }

            // Validate required fields
            if (!form.transportationType.value.trim() || !form.accommodationType.value.trim() ||
                !destinationName || !form.departureDateTime.value.trim() ||
                !form.returnDateTime.value.trim() || !form.originalPrice.value.trim() ||
                !form.totalSeats.value.trim() || !form.availableSeats.value.trim()) {
                alert("All fields except Discount Percentage and Discount End Date are required.");
                return false;
            }

            // Validate destination name length
            if (destinationName.length <= 2) {
                alert("Destination Name must be longer than 2 characters.");
                return false;
            }
         	
            // Validate destination name maximum length
            if (destinationName.length > 50) {
                alert("Destination Name cannot exceed 50 characters.");
                return false;
            }
         
            // Validate date times
            if (departureDateTime >= returnDateTime) {
                alert("Departure Date and Time must be before Return Date and Time.");
                return false;
            }

            // Validate arrangement price
            if (arrangementPrice > 10000) {
                alert("Arrangement Price cannot exceed 10000.");
                return false;
            }

            // Validate original price
            if (originalPrice > 10000) {
                alert("Original Price cannot exceed 10000.");
                return false;
            }

            // Validate seats
            if (totalSeats > 999) {
                alert("Total Seats cannot exceed 999.");
                return false;
            }

            if (availableSeats > 999) {
                alert("Available Seats cannot exceed 999.");
                return false;
            }
			
            if(availableSeats > totalSeats){
            	alert("Number of available Seats cannot exceed number of total seats.");
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
<div th:insert="~{fragments/navbar.html :: navbar}"></div>

<h2>Travel Details</h2>

<div th:if="${param.error}" class="alert alert-danger" role="alert">
    <span th:text="${param.error}"></span>
</div>

<div class="table-container">
    <div class="table-scroll">
        <table class="table table-bordered">
            <thead>
            <tr>
                <th>ID</th>
                <th>Transportation Type</th>
                <th>Accommodation Type</th>
                <th>Destination Name</th>
                <th>Location Image</th>
                <th>Travel Category</th>
                <th>Departure Date and Time</th>
                <th>Return Date and Time</th>
                <th>Number of Nights</th>
                <th>Arrangement Price</th>
                <th>Original Price</th>
                <th>Total Seats</th>
                <th>Available Seats</th>
                <th>Discount End Date</th>
                <th>Discount Percentage</th>
                <th>Edit</th>
                <th>Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="travel, iterStat : ${travels}">
                <form th:action="@{'/travels/edit?id='+${travel.id}}" method="post" onsubmit="return validateForm(this)" enctype="multipart/form-data">
                    <td><input type="text" name="id" th:value="${travel.id}" readonly></td>
                    <td>
                        <select class="form-control" id="transportationType" name="transportationType">
                            <option value="AIRPLANE" th:selected="${travel.transportationType.name() == 'AIRPLANE'}">Airplane</option>
                            <option value="BUS" th:selected="${travel.transportationType.name() == 'BUS'}">Bus</option>
                            <option value="PERSONAL" th:selected="${travel.transportationType.name() == 'PERSONAL'}">Personal</option>
                        </select>
                    </td>
                    <td>
                        <select class="form-control" id="accommodationType" name="accommodationType">
                            <option value="APARTMENT" th:selected="${travel.accommodationType.name() == 'APARTMENT'}">Apartment</option>
                            <option value="HOTEL" th:selected="${travel.accommodationType.name() == 'HOTEL'}">Hotel</option>
                        </select>
                    </td>
                    <td><input type="text" name="destinationName" th:value="${travel.destinationName}"></td>
                    <td>
                        <div class="form-group">
                            <label for="locationImage">Location Image (JPG or PNG only):</label>
                            <input type="file" class="form-control-file" id="locationImage" name="locationImage" accept=".jpg, .png">
                            <span th:value="${travel.locationImage}"></span>
                        </div>
                    </td>
                    <td>
                        <select class="form-control" id="travelCategory" name="travelCategory">
                            <option value="SKIING" th:selected="${travel.travelCategory.categoryName.name() == 'SKIING'}">Skiing</option>
                            <option value="NEW_YEAR" th:selected="${travel.travelCategory.categoryName.name() == 'NEW_YEAR'}">New Year</option>
                            <option value="LAST_MINUTE" th:selected="${travel.travelCategory.categoryName.name() == 'LAST_MINUTE'}">Last Minute</option>
                            <option value="SUMMER_VACATION" th:selected="${travel.travelCategory.categoryName.name() == 'SUMMER_VACATION'}">Summer Vacation</option>
                        </select>
                    </td>
                    <td><input type="datetime-local" class="form-control" id="departureDateTime" name="departureDateTime" th:value="${travel.departureDateTime}"></td>
                    <td><input type="datetime-local" class="form-control" id="returnDateTime" name="returnDateTime" th:value="${travel.returnDateTime}"></td>
                    
                    <td><input type="text" name="numberOfNights" th:value="${travel.numberOfNights}" readonly></td>
                    <td><input type="text" name="arrangmentPrice" th:value="${travel.arrangmentPrice}" readonly></td>
                    <td><input type="text" name="originalPrice" th:value="${travel.originalPrice}"></td>
                    <td><input type="text" name="totalSeats" th:value="${travel.totalSeats}"></td>
                    <td><input type="text" name="availableSeats" th:value="${travel.availableSeats}"></td>
                    <td><input type="datetime-local" class="form-control" name="discountEndDate" th:value="${travel.discountEndDate != null ? travel.discountEndDate : ''}"></td>
                    <td><input type="text" name="discountPercentage" th:value="${travel.discountPercentage != null ? travel.discountPercentage : '0.0'}"></td>
                    <td><button type="submit" class="btn btn-primary">Edit</button></td>
                </form>
                <form th:action="@{'/travels/delete?id='+${travel.id}}" method="post" th:if="${loggedUser != null && loggedUser.role.name() == 'MANAGER'}">
                    <td><input type="hidden" name="id" th:value="${travel.id}"><button type="submit" class="btn btn-danger">Delete</button></td>
                </form>
            </tr>
            </tbody>
        </table>
    </div>
</div>
<div class="text-center">
    <a class="btn btn-primary" th:href="@{/travels/addTravel}" th:if="${loggedUser != null && loggedUser.role.name() == 'MANAGER'}">Add Travel</a>
</div>

</body>
</html>
