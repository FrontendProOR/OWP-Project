<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Travel</title>
    <base th:href="@{/}">
    <link rel="stylesheet" type="text/css" href="css/StiloviForma.css"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
<div class="container">
    <form th:action="@{/travels/edit}" method="post" enctype="multipart/form-data">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <input type="hidden" id="id" name="id" th:value="${travel.id}">
        <div class="form-group">
            <label for="transportationType">Transportation Type:</label>
            <select class="form-control" id="transportationType" name="transportationType">
                <option th:each="type : ${transportationTypes}" th:value="${type}" th:selected="${type == travel.transportationType}">[[${type}]]</option>
            </select>
        </div>
        <div class="form-group">
            <label for="accommodationType">Accommodation Type:</label>
            <select class="form-control" id="accommodationType" name="accommodationType">
                <option th:each="type : ${accommodationTypes}" th:value="${type}" th:selected="${type == travel.accommodationType}">[[${type}]]</option>
            </select>
        </div>
        <div class="form-group">
            <label for="destinationName">Destination Name:</label>
            <input type="text" class="form-control" id="destinationName" name="destinationName" th:value="${travel.destinationName}">
        </div>
        <div class="form-group">
            <label for="locationImage">Location Image:</label>
            <input type="file" class="form-control-file" id="locationImage" name="locationImage">
        </div>
        <div class="form-group">
            <label for="travelCategory">Travel Category:</label>
            <select class="form-control" id="travelCategory" name="travelCategory">
                <option th:each="category : ${travelCategories}" th:value="${category}" th:selected="${category == travel.travelCategory}">[[${category}]]</option>
            </select>
        </div>
        <div class="form-group">
            <label for="departureDateTime">Departure Date and Time:</label>
            <input type="datetime-local" class="form-control" id="departureDateTime" name="departureDateTime" th:value="${#temporals.format(travel.departureDateTime, 'yyyy-MM-dd\'T\'HH:mm')}">
        </div>
        <div class="form-group">
            <label for="returnDateTime">Return Date and Time:</label>
            <input type="datetime-local" class="form-control" id="returnDateTime" name="returnDateTime" th:value="${#temporals.format(travel.returnDateTime, 'yyyy-MM-dd\'T\'HH:mm')}">
        </div>
        <div class="form-group">
            <label for="numberOfNights">Number of Nights:</label>
            <input type="text" class="form-control" id="numberOfNights" name="numberOfNights" th:value="${travel.numberOfNights}">
        </div>
        <div class="form-group">
            <label for="arrangmentPrice">Arrangement Price:</label>
            <input type="text" class="form-control" id="arrangmentPrice" name="arrangmentPrice" th:value="${travel.arrangmentPrice}">
        </div>
        <div class="form-group">
            <label for="totalSeats">Total Seats:</label>
            <input type="text" class="form-control" id="totalSeats" name="totalSeats" th:value="${travel.totalSeats}">
        </div>
        <div class="form-group">
            <label for="availableSeats">Available Seats:</label>
            <input type="text" class="form-control" id="availableSeats" name="availableSeats" th:value="${travel.availableSeats}">
        </div>
        <button type="submit" class="btn btn-primary">Submit</button>
    </form>
</div>
</body>
</html>
