<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <base th:href="@{/}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <title>Travel Details</title>
</head>
<body>
    <div th:insert="~{fragments/navbar.html :: navbar}"></div>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8">
                <img th:src="@{'/images/' + ${travel.locationImage}}" class="img-fluid" alt="Travel Destination">
            </div>
            <div class="col-md-4">
                <h2 th:text="${travel.destinationName}">Destination Name</h2>
                <p>Transportation: <span th:text="${travel.transportationType}">Transportation Type</span></p>
                <p>Accommodation: <span th:text="${travel.accommodationType}">Accommodation Type</span></p>
                <p>Category: <span th:text="${travel.getTravelCategory().getCategoryName().toString()}">Travel Category</span></p>
                <p>Departure: <span th:text="${travel.departureDateTime}">Departure Date</span></p>
                <p>Return: <span th:text="${travel.returnDateTime}">Return Date</span></p>
                <p>Number of Nights: <span th:text="${travel.numberOfNights}">Number of Nights</span></p>
                <p>Price: <span th:text="${travel.arrangmentPrice}">Price</span></p>
                <p>Total Seats: <span th:text="${travel.totalSeats}">Total Seats</span></p>
                <p>Available Seats: <span th:text="${travel.availableSeats}">Available Seats</span></p>
                
                <!-- Conditional "Make Reservation" button -->
                <a th:if="${loggedUser != null and loggedUser.getRole().toString() == 'BUYER'}" th:href="@{/reservations/make(travelId=${travel.id})}" class="btn btn-primary">Make Reservation</a>
            </div>
        </div>
    </div>
</body>
</html>
