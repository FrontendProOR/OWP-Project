<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <base href="@{/}">
    <style>
        /* Custom styles */
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f9f9;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 400px;
            margin: 0 auto;
            background-color: #fff;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        table {
            width: 100%;
        }

        table caption {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }

        th {
            text-align: right;
            padding-right: 10px;
        }

        td {
            padding: 5px;
        }

        input[type="text"],
        input[type="password"] {
            width: calc(100% - 20px);
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #007bff;
        }

        input[type="submit"] {
            background-color: #007bff;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #0056b3;
        }

        p {
            color: red;
            font-style: italic;
            margin-top: 10px;
        }
    </style>
</head>

<body>
<div th:insert="~{fragments/navbar.html :: navbar}"></div>
    <div class="container">
        <form method="post" th:action="@{/users/login}">
            <table>
                <caption>User Log In</caption>
                <tr>
                    <th>Email:</th>
                    <td><input type="email" value="" name="email" required></td>
                </tr>
                <tr>
                    <th>Password:</th>
                    <td><input type="password" value="" name="password" required></td>
                </tr>
                <tr>
                    <th></th>
                    <td><input type="submit" value="Log In"></td>
                </tr>
            </table>
        </form>
        <p th:text="${message}"></p>
    </div>
    <div>If you don't have an Account: <a class="btn btn-primary" th:href="@{/users/add}">Register</a></div>
</body>

</html>
