<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
</head>
<body>
    <div th:fragment="navbar">
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">Navbar</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item" th:if="${loggedUser == null}">
                            <a class="nav-link" th:href="@{/users/add}">Register</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser == null}">
                            <a class="nav-link" th:href="@{/users/login}">Login</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null}">
                            <a class="nav-link" th:href="@{/users/details(id=${loggedUser.id})}">Profile</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null}">
                            <a class="nav-link" th:href="@{/users/logout}">Logout</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null and loggedUser.role.toString() == 'MANAGER'}">
                            <a class="nav-link" th:href="@{/travels}">Travels</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null and loggedUser.role.toString() == 'MANAGER'}">
                            <a class="nav-link" th:href="@{/users}">Users</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</body>
</html>
