<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" type="text/css" href="css/StiloviForma.css"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    
</head>
<body>
    <div th:fragment="navbar">
        <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
            <div class="container-fluid">
                <a class="navbar-brand" th:href="@{/}">PutujSajt</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item" th:if="${loggedUser == null}">
                            <a class="nav-link" th:href="@{/users/add}">Register</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser == null}">
                            <a class="nav-link" th:href="@{/users/login}">Login</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null}">
                            <a class="nav-link" th:href="@{/users/details(id=${loggedUser.id})}">Profile</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null}">
                            <a class="nav-link" th:href="@{/users/logout}">Logout</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null and loggedUser.role.toString() == 'MANAGER'}">
                            <a class="nav-link" th:href="@{/travels}">Travels</a>
                        </li>
                        <li class="nav-item" th:if="${loggedUser != null and loggedUser.role.toString() == 'MANAGER'}">
                            <a class="nav-link" th:href="@{/users}">Users</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </div>
</body>
</html>
